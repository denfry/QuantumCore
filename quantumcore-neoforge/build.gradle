plugins {
    id 'net.neoforged.moddev' version '2.0.78'
}

neoForge {
    version = '21.1.172'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        quantumcore {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation project(':quantumcore-common')
}

tasks.processResources {
    filesMatching('META-INF/mods.toml') {
        expand([mod_version: project.version])
    }
}
